spring:
  application:
    name: seatlock
  datasource:
    url: jdbc:postgresql://localhost:5433/seatlock
    username: ${DB_USERNAME:seatlock}
    password: ${DB_PASSWORD:seatlock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8090}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  seat-lock:
    ttl-minutes: 5
    expiry-check-interval-ms: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
