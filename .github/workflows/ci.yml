name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatlock
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatlock -d seatlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ensure mvnw is executable
        # Belt-and-suspenders: mvnw is committed with the executable bit set, but Windows git
        # clients don't reliably track/preserve that bit, so a future commit from Windows could
        # silently strip it again and break `./mvnw` on Linux runners with "Permission denied".
        run: chmod +x backend/mvnw

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: seatlock
          DB_USERNAME: seatlock
          DB_PASSWORD: seatlock
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

      - name: Package (skip tests, already ran above)
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests

  frontend-build:
    name: Frontend build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  compose-smoke-test:
    name: docker compose up smoke test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "backend is ready"
              exit 0
            fi
            sleep 5
          done
          echo "backend never became ready" >&2
          docker compose logs app
          exit 1

      - name: Check the frontend is serving
        run: curl -sf -o /dev/null http://localhost:3100

      - name: Register + login smoke test against the live stack
        run: |
          set -e
          curl -sf -X POST http://localhost:8090/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Smoke Test","email":"ci-smoke@example.com","password":"correct-horse-battery"}'
          curl -sf -X POST http://localhost:8090/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-smoke@example.com","password":"correct-horse-battery"}' \
            | grep -q accessToken

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
