global:
  scrape_interval: 15s

scrape_configs:
  - job_name: seatlock-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # "app" is the backend's service name on the docker-compose network (see docker-compose.yml).
      # If you're running the backend outside Compose (e.g. via ./mvnw spring-boot:run) instead,
      # use host.docker.internal:8090 here so the Prometheus container can reach the host.
      - targets: ["app:8090"]
