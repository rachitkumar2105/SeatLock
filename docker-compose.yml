services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
    ports:
      - "5433:5432"
    volumes:
      - seatlock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seatlock_postgres_data:
