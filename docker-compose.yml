services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
    ports:
      - "5433:5432"
    volumes:
      - seatlock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - seatlock_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: seatlock
      DB_USERNAME: seatlock
      DB_PASSWORD: seatlock
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8090
      CORS_ALLOWED_ORIGINS: http://localhost:3100
      # Dev-only default (also the app's own fallback) — override via a .env file or real
      # secrets management for anything beyond a local/portfolio demo. Never commit a real one.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8090
        NEXT_PUBLIC_WS_URL: http://localhost:8090/ws
    ports:
      - "3100:3100"
    depends_on:
      app:
        condition: service_healthy

  # Optional observability stack — not started by `docker compose up` on its own.
  # Run `docker compose --profile observability up -d` to include these.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - seatlock_grafana_data:/var/lib/grafana

volumes:
  seatlock_postgres_data:
  seatlock_redis_data:
  seatlock_grafana_data:
